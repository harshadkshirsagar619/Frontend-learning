<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h2>Student Information</h2>
    
    <form >
    <label for="userName">Username :</label>
    <input type="text" placeholder="Enter Username" name="username" id="username">
        
    <br><br>

    <label for="surname">Last Name :</label>
    <input type="text" name="surname" id="surname">
        
    <br><br>
    
    <label for="password">password :</label>    
    <input type="password" name="Password" id="password">

    <br><br>
      
    <label for="age">Age :</label>    
    <input type="number" name="age" id="age">

    <br><br>

    <p>Select Gender : </p>
    <label for="male">Male</label>
    <input type="radio" name="Gender" id="male" value="male">
    <label for="female">Female</label>
    <input type="radio" name="Gender" id="female" value="female">
    <label for="other">Other</label>
    <input type="radio" name="Gender" id="other" value="other">
         
    <br><br>

    <p>Select Subjects : </p>
    <label for="cpp">Cpp</label>
    <input type="checkbox" name="subject" id="cpp" value="Cpps">
    
    <label for="java">Java</label>
    <input type="checkbox" name="subject" id="java" value="Javas">
    <label for="Python">Python</label>
    <input type="checkbox" name="subject" id="Python" value="Pythons">
    <label for="JavaScript">JavaScript</label>
    <input type="checkbox" name="subject" id="JavaScript" value="JS">

        <br><br>
    <input type="submit">  

    </form>
</body>
</html>
